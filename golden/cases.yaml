# The Hub golden set, blueprint section 9.11 (GoldenCase; the schema is contracts/golden_case.schema.json). A top-level
# list; every case starts "- id: GS-NN" at column 0 and the counts are read from this file, never typed. Corpus facts
# are quoted at citation length from the named document; numbers the harness computes are named by their fixture key.
# The comment line above each case keeps the v1.1 origin tag and note for people; the runner reads the case alone.
# See golden/README.md for the tier rule, the check vocabulary and the must_cite naming.
# GS-01 [v1.0] Rewritten per DP-31 and Task 3.6: effects added, FV-1201 not actuated by T3.
- id: GS-01
  category: Grounded answering
  hard_gate: false
  tier: B
  input:
    question: "Why did GA-1201A trip on high vibration in February 2025, and what is the trip setpoint?"
  expected:
    outcome: answer
    must_cite: ["WO-240003", "TJC-LLD-IL-GA-1201A", "OPL-GA-1201A-03", "P&ID Set 1"]
    must_contain:
      - "WO-240003"
      - "SEQ-1201"
      - "SIL 1"
      - "VSHH-1201"
      - "1oo2"
      - "EFF-1"
      - "EFF-2"
      - "EFF-4"
      - "EFF-5"
      - "Trip set points are DUMMY training values"
      - "XV-1201"
      - "XV-1201A/B"
      - "TJC-LLD-IL-GA-1201A"
      - "Angular misalignment 0.12 mm/100mm after foundation settlement"
      - "Shaft misalignment is the #1 root cause of GA-1201A high-vibration trips"
      - "CD-4"
    must_not_contain: []
    numerals_allowed:
      - {value: "7.4", unit: "mm/s", source_ref: "WO-240003 Problem_Description"}
      - {value: "0.12", unit: "mm/100mm", source_ref: "WO-240003 Root_Cause"}
      - {value: "1.9", unit: "mm/s", source_ref: "WO-240003 Corrective_Action"}
      - {value: "7.1", unit: "mm/s RMS", source_ref: "TJC-LLD-IL-GA-1201A row T3"}
      - {value: "1oo2", unit: "voting", source_ref: "TJC-LLD-IL-GA-1201A row T3"}
      - {value: "1", unit: "SIL", source_ref: "TJC-LLD-IL-GA-1201A header"}
      - {value: "2025-02-23", unit: "date", source_ref: "WO-240003 Report_Date"}
  sources: ["WO-240003", "TJC-LLD-IL-GA-1201A", "OPL-GA-1201A-03", "P&ID Set 1", "packages/pid_sidecars/set_01.json"]
  checks:
    - {type: "citation_resolves", args: {from: "expected.must_cite"}}
    - {type: "numeral_fidelity", args: {from: "expected.numerals_allowed"}}
    - {type: "string_present", args: {from: "expected.must_contain"}}
    - {type: "string_absent", args: {text: "EFF-3", in: "blocks.effects"}}
    - {type: "citation_resolves", args: {doc: "P&ID Set 1", reading: "XV-1201 on the suction line; XV-1201A/B on the discharge", defect_kind: "label_vs_ce_mismatch", governing_document: "TJC-LLD-IL-GA-1201A"}}
  origin: team
