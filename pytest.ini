# Plain `pytest` from the repository root must collect the same suite `make test` runs (V-05).
# legacy/audit_reference/ holds the v1.0 audit scripts; they read fixtures that only exist in that session's tree, so
# collecting them aborts the run with a FileNotFoundError before a single test executes.
[pytest]
testpaths = tests
norecursedirs = legacy .cache .git graphify-out packages thehub
